name: iOS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine is platform independent: the Linux job is the fast gate that
  # mirrors the local WSL toolchain used during development.
  core:
    name: Core (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib
        run: apt-get update && apt-get install -y zlib1g-dev libsqlite3-dev
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      # The `#if canImport(UIKit)` blocks are never compiled by the Linux
      # build — the stub modules under `Scripts/apple-stubs` make
      # `canImport` true, so the Apple-only code is type-checked here too.
      - name: Type-check the Apple-only code paths
        # A container job interpolates `github.workspace` to the host path,
        # while the checkout lives at `/__w/<repo>/<repo>`; the script derives
        # the repository from its own location and looks for the modules of
        # `swift build` in the standard `.build` of the checkout.
        run: bash Scripts/typecheck_apple.sh

  # The app shell is SwiftUI, so it only exists on Apple platforms.
  macos:
    name: App shell (macOS, Swift ${{ matrix.swift }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        # The package is swift-tools-version 6.0, so a Swift 6 toolchain is
        # required: take the newest Xcode on the image and report it, so a
        # failure in the log says which one was used.
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Build the package
        run: swift build
      - name: Test
        run: swift test
      # The iOS bundle is an XcodeGen project (project.yml) that consumes the
      # local SwiftPM package, so the app shell and the engine never drift.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build the iOS app
        run: |
          xcodebuild build \
            -project LegadoApp.xcodeproj \
            -scheme LegadoApp \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/xcode-ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Build the iOS simulator app
        run: |
          xcodebuild build \
            -project LegadoApp.xcodeproj \
            -scheme LegadoApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode-ios-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: LegadoApp-ios
          path: .build/xcode-ios/Build/Products/Debug-iphoneos/Legado.app
          if-no-files-found: ignore

  # The unsigned ipa itself is produced on macOS (`.github/workflows/
  # unsigned-ipa.yml`), but the packaging script — the staging, the signature
  # stripping, the zip layout — is platform independent: this job exercises it
  # with a fake bundle so it cannot rot unnoticed.
  packaging:
    name: Unsigned ipa packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zip and PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y zip python3-yaml
      - name: Check the packager and the workflow files
        run: bash Scripts/check_package_ipa.sh
