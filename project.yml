name: LegadoApp
options:
  bundleIdPrefix: io.legado.ios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.35.0"

# The port is a SwiftPM package; the Xcode project is a thin iOS shell that
# adds the `@main` scene, the bundle metadata and the deep-link registration.
packages:
  legado:
    path: .

targets:
  LegadoApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/LegadoAppUI
        excludes:
          - "Info.plist"
          - "Resources/**"
      - path: Sources/LegadoAppUI/Resources
        buildPhase: resources
    dependencies:
      - package: legado
        product: LegadoCore
      - package: legado
        product: LegadoUI
      - package: legado
        product: LegadoServer
      # The share extension — the iOS counterpart of the upstream
      # `SharedReceiverActivity` (the `ACTION_SEND` / `ACTION_PROCESS_TEXT`
      # receiver). It is embedded into the app.
      - target: LegadoShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.ios.Legado
        PRODUCT_NAME: Legado
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/LegadoAppUI/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # The Info.plist is committed and is the single source of truth: XcodeGen
    # must not rewrite it (the generated file would differ in the ordering and
    # the formatting and would dirty the working tree on every run). It
    # carries the deep-link scheme, the document types, the launcher icons,
    # the camera usage description and the audio background mode.

  # The share extension — the iOS counterpart of the upstream
  # `SharedReceiverActivity`: the shared text of another app is read and the
  # app is opened with it (an address is imported, anything else is searched
  # for).
  LegadoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LegadoShareExtension
        excludes:
          - "Info.plist"
    dependencies:
      - package: legado
        product: LegadoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.ios.Legado.Share
        PRODUCT_NAME: LegadoShare
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/LegadoShareExtension/Info.plist
        SKIP_INSTALL: YES

schemes:
  LegadoApp:
    build:
      targets:
        LegadoApp: all
    run:
      config: Debug
    archive:
      config: Release

  # The share extension — the iOS counterpart of the upstream
  # `SharedReceiverActivity`.
  LegadoShareExtension:
    build:
      targets:
        LegadoShareExtension: all
    run:
      config: Debug
